name: Isolated Windows build and capability check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-review
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out this public commit without persisting credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified from official tag
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify public repository and exact commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          if ($repo.private -or $repo.visibility -ne 'public') { throw 'Public repository required for free standard runner.' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Commit mismatch' }
      - name: Verify and build source inside the disposable runner
        shell: pwsh
        run: ./ci/Build-ReviewedSource.ps1
      - name: Monitor rebuilt launcher without a Java target
        shell: pwsh
        run: ./ci/Test-Launcher.ps1
      - name: Monitor offline Minecraft startup and attempt injection
        shell: pwsh
        run: ./ci/Test-Minecraft.ps1
      - name: Explain test boundary
        if: always()
        shell: pwsh
        run: |
          Write-Output 'See individual steps for actual build and monitored-launcher coverage.'
          Write-Output 'Actual injection coverage depends on game startup and the native log; gameplay is not covered.'
          Write-Output 'No Actions artifact/cache upload is configured. Results are in the job log.'
